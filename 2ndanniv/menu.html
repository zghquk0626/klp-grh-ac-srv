<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#FDF5F9;
  --bg-secondary:#FFFFFF;
  --accent:#D46091;
  --accent-dark:#9A517F;
  --accent-light:#F5D8EC;
  --text-main:#888888;
  --text-dark:#58404E;
  --text-muted:#B98BA5;
  --ease:cubic-bezier(0.25,0.46,0.45,0.94);
  --font-main:'Poppins','Avenir Next','Segoe UI',Roboto,Arial,sans-serif;
  --font-display:'Cormorant Garamond','The Seasons',Georgia,serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-main);background:var(--bg-primary);color:var(--text-main);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block}
button{font-family:var(--font-main);cursor:pointer}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:rgba(253,245,249,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(212,96,145,.12);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand-logo{height:40px;width:auto}
@media(max-width:380px){.brand-logo{height:32px}}
.lang-switcher{display:flex;align-items:center;border:1.5px solid #E8C7DA;border-radius:50px;overflow:hidden;background:#fff;flex-shrink:0}
.lang-btn{background:#fff;border:none;padding:6px 14px;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:500;color:#C9A6BA;transition:all .25s}
.lang-btn.active{background:var(--accent);color:#fff}

/* ── HERO ── */
.hero{text-align:center;padding:44px 22px 32px}
.hero-tagline{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);font-weight:500;display:block;margin-bottom:12px}
.hero h1{font-family:var(--font-display);font-weight:400;font-size:clamp(28px,6vw,52px);color:var(--text-dark);line-height:1.2}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-copy{font-size:14px;color:var(--text-muted);font-weight:300;max-width:420px;margin:14px auto 0;line-height:1.8}

/* ── CATEGORY CARDS ── */
.categories{max-width:640px;margin:0 auto;padding:0 20px 72px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:700px){.categories{grid-template-columns:repeat(3,1fr);max-width:900px;gap:20px}}
/* Boncafe source images are 640x640 with hard text in the top/bottom 140px.
   16/9 ratio + object-fit:cover shows exactly the middle 360px band (safe zone). */
.cat-card{position:relative;border:none;padding:0;background:var(--bg-secondary);border-radius:20px;overflow:hidden;aspect-ratio:16/9;box-shadow:0 6px 22px rgba(212,96,145,.12);transition:all .35s var(--ease);text-align:left}
.cat-card:first-child{grid-column:1 / -1;aspect-ratio:21/9}
@media(min-width:700px){.cat-card:first-child{grid-column:1 / -1;aspect-ratio:21/8}}
.cat-card:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(212,96,145,.2)}
.cat-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cat-card::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(88,40,62,.72) 0%,rgba(88,40,62,.15) 55%,transparent 100%)}
.cat-label{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:#fff}
.cat-name{display:block;font-family:var(--font-display);font-size:22px;line-height:1.15}
@media(min-width:700px){.cat-name{font-size:26px}}
.cat-count{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.85);margin-top:3px}

/* ── CATEGORY OVERLAY (menu list) ── */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(88,64,78,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s linear .35s}
.overlay.open{opacity:1;pointer-events:all;visibility:visible;transition:opacity .35s var(--ease)}
.sheet{background:var(--bg-primary);width:100%;max-width:640px;height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;transform:translateY(40px);transition:transform .35s var(--ease)}
.overlay.open .sheet{transform:translateY(0)}
@media(min-width:700px){.overlay{align-items:center}.sheet{height:auto;max-height:86vh;border-radius:24px;transform:translateY(24px)}.overlay.open .sheet{transform:translateY(0)}}
.sheet-head{padding:20px 24px 16px;border-bottom:1px solid var(--accent-light);flex-shrink:0;position:relative}
.sheet-tagline{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:4px}
.sheet-title{font-family:var(--font-display);font-size:30px;color:var(--text-dark);line-height:1.1}
.sheet-close{position:absolute;top:16px;right:18px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--accent-light);background:none;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text-muted);transition:all .3s;line-height:1}
.sheet-close:hover{background:var(--accent-light);color:var(--accent)}
.sheet-body{overflow-y:auto;padding:12px 16px 18px;-webkit-overflow-scrolling:touch}
.sheet-body::-webkit-scrollbar{width:4px}
.sheet-body::-webkit-scrollbar-thumb{background:var(--accent-light);border-radius:4px}

.dish{background:var(--bg-secondary);border:2px solid rgba(212,96,145,.12);border-radius:16px;margin-bottom:10px;display:flex;gap:14px;align-items:center;padding:10px 14px 10px 10px;transition:border-color .25s var(--ease);text-align:left;width:100%}
.dish:hover{border-color:var(--accent)}
.dish-img{width:72px;height:72px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--bg-primary)}
.dish-info{flex:1;min-width:0}
.dish-name{font-size:15px;font-weight:500;color:var(--text-dark);line-height:1.3}
.dish-desc{font-size:12.5px;color:var(--text-muted);font-weight:300;line-height:1.55;margin-top:3px}
.dish-tap{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500;color:var(--accent);margin-top:5px;opacity:.75}

/* ── MESSAGE POPUP ── */
.msg-card{background:var(--bg-secondary);width:calc(100% - 48px);max-width:340px;border-radius:22px;padding:0;overflow:hidden;text-align:center;box-shadow:0 30px 80px rgba(88,40,62,.25);transform:scale(.9);transition:transform .3s var(--ease)}
.overlay.open .msg-card{transform:scale(1)}
.msg-img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
.msg-body{padding:20px 24px 24px}
.msg-dish{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.msg-text{font-family:var(--font-display);font-size:23px;color:var(--text-dark);line-height:1.3;margin-bottom:18px}
.msg-btn{background:var(--accent);color:#fff;border:none;border-radius:50px;padding:12px 32px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500;transition:all .3s var(--ease)}
.msg-btn:hover{background:var(--accent-dark)}

/* ── FOOTER ── */
footer{text-align:center;padding:0 24px 48px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)}
footer .brand-mini{font-family:var(--font-display);font-size:18px;letter-spacing:2px;color:var(--text-dark);text-transform:uppercase;margin-bottom:6px}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.cat-card{animation:fadeUp .5s var(--ease) backwards}
.cat-card:nth-child(1){animation-delay:.05s}.cat-card:nth-child(2){animation-delay:.12s}.cat-card:nth-child(3){animation-delay:.19s}.cat-card:nth-child(4){animation-delay:.26s}.cat-card:nth-child(5){animation-delay:.33s}
</style>

/* ── STATE ── */
let lang = 'id';
let openCat = null;

/* ── LANGUAGE ── */
function setLang(l){
  lang = l;
  document.documentElement.lang = l;
  document.getElementById('btn-id').classList.toggle('active', l==='id');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const v = I18N[l][el.dataset.i18n];
    if(v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const v = I18N[l][el.dataset.i18nHtml];
    if(v) el.innerHTML = v;
  });
  renderCats();
  if(openCat) renderSheet(openCat, false);
}

/* ── RENDER CATEGORY CARDS ── */
function renderCats(){
  const grid = document.getElementById('catGrid');
  grid.innerHTML = CATS.map(c=>`
    <button class="cat-card" onclick="openCatSheet('${c.id}')">
      <img src="${c.img}" alt="${c.name[lang]}" loading="lazy">
      <span class="cat-label">
        <span class="cat-name">${c.name[lang]}</span>
        <span class="cat-count">${c.dishes.length} ${I18N[lang].dishes}</span>
      </span>
    </button>`).join('');
}

/* ── CATEGORY SHEET ── */
function openCatSheet(catId){
  openCat = catId;
  renderSheet(catId, true);
}
function renderSheet(catId, animate){
  const c = CATS.find(x=>x.id===catId);
  document.getElementById('sheetTagline').textContent = `${c.dishes.length} ${I18N[lang].dishes}`;
  document.getElementById('sheetTitle').textContent = c.name[lang];
  document.getElementById('sheetBody').innerHTML = c.dishes.map(d=>`
    <button class="dish" onclick="showMsg(${d.id})">
      <img class="dish-img" src="${d.img}" alt="${d.name}" loading="lazy" onerror="this.onerror=null;this.src='${PH}'">
      <span class="dish-info">
        <span class="dish-name">${d.name}</span>
        <div class="dish-desc">${d.desc[lang]}</div>
        <div class="dish-tap">${I18N[lang].tap}</div>
      </span>
    </button>`).join('');
  const ov = document.getElementById('catOverlay');
  ov.classList.add('open');
  ov.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  if(animate) document.querySelector('#catOverlay .sheet-body').scrollTop = 0;
}
function closeCat(){
  const ov = document.getElementById('catOverlay');
  ov.classList.remove('open');
  ov.setAttribute('aria-hidden','true');
  openCat = null;
  document.body.style.overflow='';
}

/* ── MESSAGE POPUP ── */
function showMsg(dishId){
  const ov = document.getElementById('msgOverlay');
  const img = document.getElementById('msgImg');
  const label = document.getElementById('msgDish');
  if(dishId !== undefined){
    const d = CATS.flatMap(c=>c.dishes).find(x=>x.id===dishId);
    if(d){
      label.textContent = d.name;
      img.style.display = '';
      img.onerror = () => { img.style.display = 'none'; };
      img.src = d.img;
    }
  } else { img.style.display = 'none'; }
  ov.classList.add('open');
  ov.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeMsg(){
  const ov = document.getElementById('msgOverlay');
  ov.classList.remove('open');
  ov.setAttribute('aria-hidden','true');
  document.body.style.overflow = document.getElementById('catOverlay').classList.contains('open') ? 'hidden' : '';
}

/* ── CLOSE ON BACKDROP / ESC ── */
['catOverlay','msgOverlay'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{
    if(e.target===document.getElementById(id)) id==='catOverlay'?closeCat():closeMsg();
  });
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('msgOverlay').classList.contains('open')) closeMsg();
    else if(document.getElementById('catOverlay').classList.contains('open')) closeCat();
  }
});

/* ── INIT ── */
setLang('id');
</script>
</body>
</html>
