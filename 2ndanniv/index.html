<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revolushine 2nd Anniversary Gathering</title>
<meta name="description" content="You are warmly invited to Revolushine 2nd Anniversary Gathering — Wednesday, 25 November 2026, Boncafe Jl Raya Gubeng No.46. Kamu diundang untuk merayakan anniversary ke-2 Revolushine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#FDF5F9;
  --bg-secondary:#FFFFFF;
  --accent:#D46091;
  --accent-dark:#9A517F;
  --accent-light:#F5D8EC;
  --text-dark:#58404E;
  --text-muted:#B98BA5;
  --ease:cubic-bezier(0.25,0.46,0.45,0.94);
  --font-main:'Poppins','Avenir Next','Segoe UI',Roboto,Arial,sans-serif;
  --font-display:'Cormorant Garamond','The Seasons',Georgia,serif;
}
body{font-family:var(--font-main);background:var(--bg-primary);color:var(--text-dark);line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit}
button{font-family:var(--font-main);cursor:pointer}

.page{max-width:520px;margin:0 auto;padding:20px 16px 48px}

.poster{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px rgba(212,96,145,.22);margin-top:8px}
.poster img{width:100%;height:auto}

.links{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:50px;padding:15px 24px;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;font-weight:500;transition:all .35s var(--ease);border:none;width:100%}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-maps{background:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(212,96,145,.35)}
.btn-maps:hover{background:var(--accent-dark);transform:translateY(-2px);box-shadow:0 12px 30px rgba(212,96,145,.4)}
.btn-menu{background:var(--bg-secondary);color:var(--accent-dark);border:1.5px solid var(--accent-light)}
.btn-menu:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}

.note{margin-top:20px;text-align:center;font-size:12px;color:var(--text-muted);font-weight:300;line-height:1.8}
.note strong{color:var(--accent-dark);font-weight:500}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.poster{animation:fadeUp .6s var(--ease) backwards}
.links{animation:fadeUp .6s var(--ease) .2s backwards}
.note{animation:fadeUp .6s var(--ease) .35s backwards}
</style>
</head>
<body>
<div class="page">

  <div class="poster">
    <img src="revobirthday.jpg" alt="Revolushine 2nd Anniversary Gathering — Wednesday, 25 November 2026, 15.00–17.00 WIB, Boncafe Jl Raya Gubeng No.46, Dresscode: Pastel">
  </div>

  <div class="links">
    <a class="btn btn-maps" href="https://share.google/D3ozc9jynnXjKhiDZ" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      Google Maps Direction
    </a>
    <a class="btn btn-menu" href="menu.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v8a3 3 0 0 0 6 0V3"/><path d="M9 11v10"/><path d="M17 3c-1.5 1.5-2 4-2 6 0 2 .5 3 2 3v9"/></svg>
      Lihat Menu — View Menu
    </a>
  </div>

  <p class="note">
    Sampai jumpa <strong>Rabu, 25 November 2026</strong> pukul 15.00–17.00 WIB di Boncafe, Jl Raya Gubeng No.46.<br>
    Jangan lupa <strong>dresscode pastel</strong>! — See you there!
  </p>

</div>
</body>
</html>
